<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A small task manager built with HTML, CSS and vanilla JavaScript."
    />
    <title>Todo App | 16alves02</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <main class="app">
      <header>
        <h1>
          <i class="fas fa-check-circle" aria-hidden="true"></i>
          My Tasks
        </h1>
        <p id="date"></p>
      </header>

      <form class="todo-input" id="todo-form">
        <label class="visually-hidden" for="task-input">New task</label>
        <input
          type="text"
          id="task-input"
          placeholder="What do you need to do?"
          maxlength="120"
          autocomplete="off"
        />
        <button id="add-task" type="submit" aria-label="Add task" title="Add task">
          <i class="fas fa-plus" aria-hidden="true"></i>
        </button>
      </form>

      <nav class="filters" aria-label="Filter tasks">
        <button class="filter active" type="button" data-filter="all" aria-pressed="true">
          All
        </button>
        <button class="filter" type="button" data-filter="active" aria-pressed="false">
          Active
        </button>
        <button class="filter" type="button" data-filter="completed" aria-pressed="false">
          Completed
        </button>
      </nav>

      <section class="todos-container" aria-label="Task list">
        <ul id="todos-list"></ul>

        <div class="empty-state" id="empty-state" aria-live="polite">
          <i class="fas fa-clipboard-list" aria-hidden="true"></i>
          <p id="empty-state-message">No tasks here yet.</p>
        </div>
      </section>

      <footer>
        <p id="items-left" aria-live="polite">0 items left</p>
        <button id="clear-completed" type="button">Clear completed</button>
        <p class="github-link">
          <i class="fab fa-github" aria-hidden="true"></i>
          <a
            href="https://github.com/16alves02"
            target="_blank"
            rel="noopener noreferrer"
          >
            16alves02
          </a>
        </p>
      </footer>
    </main>

    <script src="scripts.js"></script>
  </body>
</html>
