<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#ff69b4">
  <meta name="description" content="This page does not exist. Return to the 16alves02 Todo App.">
  <title>Page not found | Todo App</title>
  <style>
    :root {
      color-scheme: light;
      --pink: #ff69b4;
      --orange: #ffa500;
      --ink: #212529;
      --muted: #68717a;
      --paper: #f1f3f5;
      --line: #e9ecef;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--paper); }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: clamp(18px, 5vw, 48px);
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 14%, rgb(255 105 180 / 12%), transparent 30rem),
        radial-gradient(circle at 88% 85%, rgb(255 165 0 / 11%), transparent 28rem),
        var(--paper);
      font: 16px/1.6 Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 560px);
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 22px 60px rgb(33 37 41 / 10%);
    }
    header {
      padding: 24px clamp(22px, 5vw, 34px);
      color: #fff;
      background: linear-gradient(120deg, var(--pink), #ff83a9 65%, var(--orange));
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1.5px solid currentColor;
      border-radius: 9px;
      font-size: 19px;
      line-height: 1;
    }
    .content { padding: clamp(28px, 6vw, 44px); }
    .code {
      margin: 0;
      color: var(--pink);
      font-size: clamp(5rem, 20vw, 8rem);
      font-weight: 900;
      letter-spacing: -.09em;
      line-height: .9;
    }
    .eyebrow {
      margin: 22px 0 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 12ch;
      margin: 0;
      font-size: clamp(1.7rem, 6vw, 2.5rem);
      line-height: 1.08;
      letter-spacing: -.055em;
    }
    .message {
      max-width: 42ch;
      margin: 16px 0 0;
      color: var(--muted);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }
    a {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      padding: 11px 16px;
      border: 1px solid var(--ink);
      border-radius: 9px;
      color: #fff;
      background: var(--ink);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: transform .18s ease, background-color .18s ease;
    }
    a.secondary { color: var(--ink); background: #fff; border-color: var(--line); }
    a:hover { transform: translateY(-2px); background: var(--pink); color: #fff; border-color: var(--pink); }
    a:focus-visible { outline: 3px solid var(--orange); outline-offset: 4px; }
    footer {
      padding: 16px clamp(22px, 5vw, 34px);
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    @media (max-width: 460px) {
      .actions a { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="brand"><span class="brand-mark" aria-hidden="true">✓</span> My Tasks <span>·</span> 16alves02</p>
    </header>
    <section class="content" aria-labelledby="not-found-title">
      <p class="code" aria-hidden="true">404</p>
      <p class="eyebrow">Page not found / Wrong route</p>
      <h1 id="not-found-title">This task has no address.</h1>
      <p class="message">The page may have moved, or the address may be incorrect. Your task list is still where you left it.</p>
      <nav class="actions" aria-label="Recovery options">
        <a href="/">Back to my tasks <span aria-hidden="true">&nbsp;↗</span></a>
        <a class="secondary" href="https://github.com/16alves02" rel="noopener noreferrer">GitHub profile</a>
      </nav>
    </section>
    <footer>16ALVES02 / TODO APP / NOT FOUND</footer>
  </main>
</body>
</html>
